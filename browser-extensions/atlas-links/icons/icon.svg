<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="64" cy="64" r="60"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#2F4DAA"/>

  <!-- Wireframe globe lines -->
  <g clip-path="url(#circle-clip)" fill="none" stroke="white" stroke-opacity="0.35" stroke-width="1.5">
    <ellipse cx="64" cy="28" rx="52" ry="4"/>
    <ellipse cx="64" cy="44" rx="56" ry="5"/>
    <line x1="4" y1="64" x2="124" y2="64"/>
    <ellipse cx="64" cy="84" rx="56" ry="5"/>
    <ellipse cx="64" cy="100" rx="52" ry="4"/>
    <ellipse cx="64" cy="64" rx="12" ry="58"/>
    <ellipse cx="64" cy="64" rx="30" ry="58"/>
    <ellipse cx="64" cy="64" rx="48" ry="58"/>
    <line x1="64" y1="4" x2="64" y2="124"/>
  </g>

  <!-- Outer ring -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="white" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Link/chain glyph: two interlocking ovals (signals "link redirector") -->
  <g fill="none" stroke="white" stroke-width="6" stroke-linecap="round">
    <path d="M44 64 L52 56 a14 14 0 0 1 20 0 l8 8" />
    <path d="M84 64 L76 72 a14 14 0 0 1 -20 0 l-8 -8" />
  </g>
</svg>
